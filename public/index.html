<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AgentHub - Remote Control</title>
  <style>
    :root {
      --bg: #121317;
      --card-bg: #1a1b23;
      --text: #e2e8f0;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --term-bg: #0d0e12;
      --term-text: #a3e635;
      --border: #2d3748;
      --sidebar-bg: #1a1b23;
      --sidebar-border: #2d3748;
      --glass-bg: rgba(26, 27, 35, 0.7);
      --glass-border: rgba(45, 55, 72, 0.3);
      --chat-bg: #1e1e2e;
      --chat-user-bg: #89b4fa;
      --chat-agent-bg: #f5c2e7;
      --chat-text: #cdd6f4;
      --chat-user-text: #1e1e2e;
      --chat-agent-text: #1e1e2e;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header div {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 9999px;
      background: #374151;
      color: #9ca3af;
      font-weight: 500;
      border: none;
      outline: none;
      cursor: pointer;
    }
    .badge.connected {
      background: #065f46;
      color: #6ee7b7;
    }
    .badge.running {
      background: #1e3a8a;
      color: #93c5fd;
    }
    .toolbar {
      background: var(--card-bg);
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .toolbar button, .toolbar select {
      background: #282c37;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .toolbar button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .toolbar button.danger {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }
    button.toggle {
      background: #282c37;
      border: 1px solid var(--border);
      color: var(--text);
    }
    button.toggle.active {
      background: var(--accent);
      color: #fff;
    }
    #terminal-container, #chat-container {
      flex: 1;
      min-height: 0;
      min-width: 0;
      padding: 12px;
      overflow-y: auto;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
      font-size: 0.9rem;
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.4;
      display: none;
    }
    #terminal-container {
      display: block;
      background: var(--term-bg);
      color: var(--term-text);
      padding: 0; /* xterm needs 0 padding to prevent weird scrollbars sometimes, we'll see */
      overflow: hidden; /* xterm handles its own scrolling */
    }
    #chat-container {
      display: none;
      background: var(--chat-bg);
      color: var(--chat-text);
      flex-direction: column;
    }
    .chat-bubble {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 18px;
      margin: 8px 0;
      word-wrap: break-word;
      line-height: 1.5;
    }
    .chat-bubble.user {
      background: var(--chat-user-bg);
      color: var(--chat-user-text);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .chat-bubble.agent {
      background: var(--chat-agent-bg);
      color: var(--chat-agent-text);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      padding: 6px 10px;
      gap: 8px;
    }
    .quick-actions button {
      background: #2a2e3d;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }
    footer {
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      padding: 8px 10px;
      display: flex;
      gap: 8px;
    }
    #input-form {
      display: flex;
      width: 100%;
      gap: 8px;
    }
    #command-input {
      flex: 1;
      background: #111317;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
    }
    #command-input:focus {
      border-color: var(--accent);
    }
    #send-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    /* Settings Modal */
    #settings-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    #settings-modal-content {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 24px;
      width: 90%;
      max-width: 400px;
      backdrop-filter: blur(10px);
    }
    #settings-modal-content h2 {
      margin-top: 0;
      margin-bottom: 16px;
      color: var(--text);
      font-size: 1.5rem;
    }
    #settings-modal-content label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }
    #settings-modal-content input {
      width: 100%;
      padding: 10px 14px;
      background: #111317;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 16px;
    }
    #settings-modal-content input:focus {
      border-color: var(--accent);
    }
    #settings-modal-content .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }
    #settings-modal-content .modal-actions button {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    #settings-modal-content .modal-actions button.cancel {
      background: #374151;
      color: var(--text);
    }
    #settings-modal-content .modal-actions button.save {
      background: var(--accent);
      color: white;
    }
  
    /* Layout & Sidebars */
    #app-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    .sidebar {
      width: 250px;
      background: #1a1b23;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease;
    }
    .sidebar-header {
      padding: 12px;
      font-weight: bold;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #2a2e3d;
    }
    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .sidebar-item {
      padding: 8px;
      margin-bottom: 4px;
      background: #282c37;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .sidebar-item:hover {
      background: var(--accent);
    }
    .file-item {
      font-size: 0.8rem;
      padding: 4px;
      word-break: break-all;
    }
    .file-item.highlight {
      color: #10b981;
      font-weight: bold;
    }
    #main-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }
    @media (max-width: 768px) {
      .sidebar {
        position: absolute;
        z-index: 50;
        height: 100%;
        transform: translateX(-100%);
      }
      .sidebar.open {
        transform: translateX(0);
      }
    }
    
    #btn-sidebar-toggle {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .cost-badge {
      background: #10b981;
      color: #fff;
    }

  
    .top-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    @media (max-width: 768px) {
      .top-controls {
        display: none;
        flex-direction: column;
        align-items: stretch;
        width: 100%;
        background: var(--card-bg);
        border-bottom: 1px solid var(--border);
        padding: 8px 14px;
      }
      .top-controls.open {
        display: flex;
      }
      .toolbar {
        border-bottom: none;
        padding: 0;
      }
    }

    @media (max-width: 768px) {
      #btn-sidebar-close { display: block !important; }
    }
</style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
</head>
<body>

  <!-- Splash Screen for PC -->
  <div id="splash-screen" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);z-index:9999;flex-direction:column;justify-content:center;align-items:center;text-align:center;">
    <h1 style="font-size:2.5rem;margin-bottom:10px;">AgentHub</h1>
    <p style="color:#9ca3af;margin-bottom:30px;">Scan this code with your phone to remote control the swarm.</p>
    <div style="background:white;padding:20px;border-radius:12px;margin-bottom:30px;">
      <img id="splash-qr" src="" alt="QR Code" style="width:250px;height:250px;display:block;" />
    </div>
    <p id="splash-url" style="color:var(--accent);margin-bottom:20px;font-family:monospace;"></p>
    <button id="btn-splash-continue" style="background:#282c37;color:white;border:1px solid var(--border);padding:10px 20px;border-radius:6px;cursor:pointer;font-weight:bold;">Continue to AgentHub on PC</button>
  </div>

  
  <div id="app-container">
    <aside id="sidebar" class="sidebar" style="display:flex; flex-direction:column; overflow:hidden;">
      <div class="sidebar-header" style="justify-content:space-between;">
        Controls
        <button id="btn-sidebar-close" style="display:none; background:transparent;border:none;color:white;cursor:pointer;font-weight:bold;font-size:1.1rem;">×</button>
      </div>
      
      <div class="sidebar-content" style="flex:0 0 auto; display:flex; flex-direction:column; gap:8px; overflow-y:visible; padding:12px;">
        <select id="agent-select" style="padding:8px; background:#111317; color:white; border:1px solid var(--border); border-radius:6px;">
          <option value="agy">agy</option>
          <option value="aider">aider</option>
          <option value="bash">bash</option>
          <option value="cmd">cmd.exe</option>
        </select>
        
        <div style="display:flex; gap:8px;">
          <button class="primary" id="btn-spawn" style="flex:1; padding:8px; border-radius:6px; cursor:pointer; background:var(--accent); border:none; color:white; font-weight:bold;">Start Agent</button>
          <button id="btn-clear" style="padding:8px; border-radius:6px; cursor:pointer; background:#282c37; border:1px solid var(--border); color:white;">Clear</button>
        </div>
        
        <button class="toggle" id="btn-view-toggle" style="padding:8px; border-radius:6px; cursor:pointer; border:1px solid var(--border); width:100%;">Chat View</button>
        
        <button class="toggle" id="btn-orchestrator" style="padding:8px; border-radius:6px; cursor:pointer; border:1px solid var(--border); width:100%;">Orchestrator Mode</button>
        <div id="orchestrator-panel" style="display: none; background: #2a2e3d; padding: 8px; border: 1px solid var(--border); border-radius: 6px; flex-direction: column; gap: 8px; width: 100%;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 0.8rem; font-weight: 600; color: var(--accent);">Subagents</span>
            <button type="button" id="btn-select-all" style="font-size: 0.7rem; padding: 2px 6px; background: #1a1b23; color: var(--text); border: 1px solid var(--border); border-radius: 4px; cursor: pointer;">Select All</button>
          </div>
          <label style="font-size: 0.85rem; display: flex; align-items: center; gap: 6px; cursor: pointer; color: white;">
            <input type="checkbox" class="subagent-cb" value="aider"> Aider
          </label>
          <span style="font-size: 0.7rem; color: #9ca3af; line-height: 1.2;">(Auto-delegates commands)</span>
        </div>
        <button id="btn-pause" style="background:#eab308;color:black;border:none;font-weight:bold; padding:8px; border-radius:6px; cursor:pointer; width:100%;">Pause Swarm</button>
        
        <div style="display:flex; gap:8px; margin-top:4px;">
          <button id="btn-qr-modal" style="background:#10b981;color:white;border:none;flex:1;padding:6px;border-radius:4px;cursor:pointer;font-weight:bold;">📱 QR</button>
          <button id="btn-settings" style="background:#374151;color:white;border:none;flex:1;padding:6px;border-radius:4px;cursor:pointer;font-weight:bold;">Settings</button>
          <button id="btn-models" style="background:#8b5cf6;color:white;border:none;flex:1;padding:6px;border-radius:4px;cursor:pointer;font-weight:bold;">Models</button>
        </div>
      </div>
      
      <div class="sidebar-header" style="border-top:1px solid var(--border); justify-content:space-between;">
        Sessions
        <button id="btn-new-session" style="background:var(--accent);border:none;color:white;border-radius:4px;padding:2px 8px;cursor:pointer;font-weight:bold;">+</button>
      </div>
      <div class="sidebar-content" id="session-list" style="flex:1; overflow-y:auto;"></div>
      
      <div class="sidebar-header" style="border-top:1px solid var(--border);">Files Changed</div>
      <div class="sidebar-content" id="file-list" style="flex:0 0 120px; overflow-y:auto;"></div>
    </aside>
    
    <div id="main-col">

  <header style="flex-wrap: wrap;">
    <div style="display:flex; align-items:center; gap:8px; justify-content:space-between; width:100%;">
      <div style="display:flex; align-items:center; gap:8px;">
        <button id="btn-sidebar-toggle">☰</button>
        <h1 id="title-btn" style="color: var(--danger); cursor: pointer; user-select: none; transition: color 0.3s;">AgentHub</h1>
        
      </div>
      
    </div>
  </header>




  <main id="terminal-container"></main>
  <main id="chat-container"></main>

  <section class="quick-actions">
    <button type="button" data-key="\x1b[A">↑</button>
    <button type="button" data-key="\x1b[B">↓</button>
    <button type="button" data-key="\x1b[D">←</button>
    <button type="button" data-key="\x1b[C">→</button>
    <button type="button" data-key="\t">Tab</button>
    <button type="button" data-key="\x07">Ctrl+G</button>
    <button type="button" data-key="y\r">Y</button>
    <button type="button" data-key="n\r">N</button>
    <button type="button" data-key="\x03">Ctrl+C</button>
    <button type="button" data-key="\r">Enter</button>
  </section>

  <footer>
    <form id="input-form" style="display:flex; width:100%; gap:8px;">
      <button type="button" class="toggle" id="btn-auto" style="border:1px solid var(--border); padding:10px 14px; border-radius:6px; font-weight:bold; cursor:pointer;">Auto</button>
      <input type="text" id="command-input" placeholder="Type prompt or response (e.g. y/n)..." autocomplete="off" autocapitalize="none" style="flex:1;" />
      <button type="submit" id="send-btn">Send</button>
    </form>
  </footer>

  
    </div>
  </div>

  <!-- Models Modal -->
  <div id="models-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);justify-content:center;align-items:center;z-index:1000;">
    <div style="background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:12px;padding:24px;width:90%;max-width:400px;backdrop-filter:blur(10px);">
      <h2>Add LiteLLM Model</h2>
      <label>Model Name (alias)</label>
      <input type="text" id="model-name" placeholder="sims-agent" style="width:100%;margin-bottom:8px;" />
      <label>Actual Model ID</label>
      <input type="text" id="model-id" placeholder="openai/local-model" style="width:100%;margin-bottom:8px;" />
      <label>API Base URL</label>
      <input type="text" id="model-base" placeholder="http://localhost:11434/v1" style="width:100%;margin-bottom:8px;" />
      <label>API Key</label>
      <input type="text" id="model-key" placeholder="not-needed" style="width:100%;margin-bottom:16px;" />
      <div style="display:flex;gap:12px;justify-content:flex-end;">
        <button id="btn-models-cancel" style="padding:8px;background:#374151;color:white;border:none;border-radius:4px;">Cancel</button>
        <button id="btn-models-save" style="padding:8px;background:var(--accent);color:white;border:none;border-radius:4px;">Save</button>
      </div>
    </div>
  </div>
<!-- Settings Modal -->
  <div id="settings-modal">
    <div id="settings-modal-content">
      <h2>Settings</h2>
      <label for="api-key-input">OpenAI API Key</label>
      <input type="password" id="api-key-input" placeholder="sk-..." />
      <div class="modal-actions">
        <button type="button" id="btn-settings-cancel">Cancel</button>
        <button type="button" id="btn-settings-save">Save</button>
      </div>
    </div>
  </div>

  
  <!-- QR Modal -->
  <div id="qr-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);justify-content:center;align-items:center;z-index:2000;">
    <div style="background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:12px;padding:24px;width:90%;max-width:350px;backdrop-filter:blur(10px);text-align:center;">
      <h2 style="margin-bottom:15px;font-size:1.2rem;">Mobile Access</h2>
      <div style="background:white;padding:10px;border-radius:8px;display:inline-block;margin-bottom:15px;">
        <img id="modal-qr-img" src="" alt="QR" style="width:200px;height:200px;display:block;" />
      </div>
      <p id="modal-qr-url" style="color:var(--accent);font-family:monospace;margin-bottom:15px;word-break:break-all;font-size:0.9rem;"></p>
      
      <div style="display:flex; justify-content:center; gap:10px;">
        <button id="btn-qr-restart" style="background:#eab308;color:black;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:bold;">Restart Tunnel</button>
        <button id="btn-qr-close" style="background:#374151;color:white;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:bold;">Close</button>
      </div>

    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
